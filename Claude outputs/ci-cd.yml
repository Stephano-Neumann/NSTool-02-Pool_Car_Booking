name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: nst-car-booking

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: API tests
        run: docker build --target test -t nst-car-booking:test .

      - name: Build release image
        run: docker build --build-arg APP_VERSION=${{ github.sha }} -t nst-car-booking:ci .

      - name: Smoke test the container
        run: |
          docker run -d --name smoke -p 8080:8080 \
            -e APP_ENV=local -e AUTH_MODE=local -e SEED_TEST_DATA=true \
            -v smoke-data:/data nst-car-booking:ci
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:8080/health | grep -q '"status":"ok"'; then echo "healthy"; exit 0; fi
            sleep 2
          done
          docker logs smoke
          exit 1

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC login to Azure, no stored credentials
    env:
      RG: ${{ vars.AZURE_RESOURCE_GROUP }}
      APP_ENV: ${{ vars.APP_ENV || 'staging' }}
      AUTH_MODE: ${{ vars.AUTH_MODE || 'local' }}
      SEED_TEST_DATA: ${{ vars.SEED_TEST_DATA || 'true' }}
      ADMIN_EMAILS: ${{ vars.ADMIN_EMAILS || '' }}
      ALLOWED_EMAIL_DOMAINS: ${{ vars.ALLOWED_EMAIL_DOMAINS || '' }}
      ALLOWED_IP_RANGES: ${{ vars.ALLOWED_IP_RANGES || '[]' }}
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Provision infrastructure (registry, storage, environment)
        id: infra
        run: |
          out=$(az deployment group create -g "$RG" -f infra/main.bicep \
            -p deployApp=false appEnv="$APP_ENV" --query properties.outputs -o json)
          echo "acr=$(echo "$out" | jq -r .acrName.value)" >> "$GITHUB_OUTPUT"
          echo "server=$(echo "$out" | jq -r .acrLoginServer.value)" >> "$GITHUB_OUTPUT"

      - name: Build and push image in Azure Container Registry
        run: |
          az acr build -r "${{ steps.infra.outputs.acr }}" \
            -t "$IMAGE_NAME:${{ github.sha }}" \
            --build-arg APP_VERSION=${{ github.sha }} .

      - name: Deploy new revision
        id: deploy
        run: |
          out=$(az deployment group create -g "$RG" -f infra/main.bicep \
            -p image="${{ steps.infra.outputs.server }}/$IMAGE_NAME:${{ github.sha }}" \
               appEnv="$APP_ENV" authMode="$AUTH_MODE" seedTestData="$SEED_TEST_DATA" \
               adminEmails="$ADMIN_EMAILS" allowedEmailDomains="$ALLOWED_EMAIL_DOMAINS" allowedIpRanges="$ALLOWED_IP_RANGES" \
               appVersion="${{ github.sha }}" dataApiKey="${{ secrets.DATA_API_KEY }}" \
            --query properties.outputs -o json)
          echo "fqdn=$(echo "$out" | jq -r .appFqdn.value)" >> "$GITHUB_OUTPUT"

      - name: Verify the new revision is healthy
        run: |
          APP="ca-nstcarbooking"
          # Checked through the Azure control plane, so it works when ALLOWED_IP_RANGES blocks GitHub runners.
          for i in $(seq 1 30); do
            rev=$(az containerapp revision list -g "$RG" -n "$APP" -o json \
              | jq -c --arg sha "${{ github.sha }}" '[.[] | select(.properties.active == true and (.properties.template.containers[0].image | contains($sha)))][0] // empty')
            if [ -n "$rev" ]; then
              name=$(echo "$rev" | jq -r .name)
              health=$(echo "$rev" | jq -r .properties.healthState)
              state=$(echo "$rev" | jq -r .properties.runningState)
              echo "Revision $name: health=$health running=$state"
              if [ "$health" = "Healthy" ] && [ "$state" = "Running" ]; then exit 0; fi
            else
              echo "No active revision with image tag ${{ github.sha }} yet"
            fi
            sleep 10
          done
          echo "Revision did not become healthy in time. Revisions:"
          az containerapp revision list -g "$RG" -n "$APP" -o table
          echo "Roll back by activating the previous revision: az containerapp revision activate -g $RG -n $APP --revision <name>"
          exit 1
